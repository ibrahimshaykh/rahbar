apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
  namespace: rahbar
  labels: {app.kubernetes.io/part-of: rahbar}
  annotations:
    # No rewrite-target: the API expects /api/ask, not /ask.
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          # More specific path first.
          # The UI's status chip reads the API's own readiness. Exact, so only
          # this one path reaches the api; /healthz and /metrics stay internal.
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8080
