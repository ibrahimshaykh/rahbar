apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app: indexer
    app.kubernetes.io/name: reindex
    app.kubernetes.io/part-of: rahbar
    app.kubernetes.io/component: indexer
spec:
  schedule: "0 2 * * 0"            # Sundays at 02:00 - weekly
  timeZone: "Asia/Karachi"
  concurrencyPolicy: Forbid        # never two writers
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      completions: 1
      backoffLimit: 4
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: indexer
            app.kubernetes.io/name: reindex
            app.kubernetes.io/part-of: rahbar
            app.kubernetes.io/component: indexer
        spec:
          restartPolicy: OnFailure
          serviceAccountName: rahbar-indexer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              args: ["python", "-m", "pipeline.run"]
              envFrom:
                - configMapRef:
                    name: rahbar-config
              resources:                 # observed peak 788Mi, docs/evidence/kubectl_top_indexer.txt
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
