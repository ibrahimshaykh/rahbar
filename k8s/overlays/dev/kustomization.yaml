apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar
resources:
  - ../../base

images:
  - name: rahbar-api
    newTag: dev
  - name: rahbar-ui
    newTag: dev
  - name: rahbar-indexer
    newTag: dev

patches:
  - path: patch-config-dev.yaml
  - path: patch-host-ipblock.yaml
  - path: patch-indexer-host-ipblock.yaml
  - path: patch-indexer-dummy.yaml
