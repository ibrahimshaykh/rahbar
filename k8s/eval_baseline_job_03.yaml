# Part B baseline: two seeded suite runs against the live api (collection rahbar_ragops_03).
# Apply: kubectl apply -f k8s/eval_baseline_job_03.yaml ; results land on the PVC under /data/eval/results.
# Part B+C evaluation Job. Exit status == release gate exit status (backoffLimit 0).
# Gate flip without a rebuild: edit ConfigMap rahbar-gate-03 and re-run (see F-T11).
apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-baseline-03
  namespace: rahbar
  labels:
    app: ragops-eval-03
    app.kubernetes.io/part-of: rahbar
    ragops: "03"
spec:
  completions: 1
  backoffLimit: 0                   # a gate FAIL must not be retried into a PASS
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ragops-eval-03
        app.kubernetes.io/part-of: rahbar
        ragops: "03"
    spec:
      restartPolicy: Never
      serviceAccountName: rahbar-ragops-03
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eval
          image: rahbar-ragops-03:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "eval.run_suite_03", "--api", "http://api:8000",
                    "--golden", "eval/golden_03.jsonl", "--seed", "1337", "--runs", "2",
                    "--out-dir", "/data/eval/results", "--tag", "baseline", "--require-cold", "--chroma"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - {name: RAGOPS_ROOT, value: /data}
            - {name: TIMING_CORPUS_DIR, value: /corpus-baked}   # raw corpus files live here in the image
            - {name: EVAL_TARGET_URL, value: "http://api-candidate-03:8000"}
            - {name: EVAL_BASELINE_URL, value: "http://api:8000"}
            - {name: EVAL_TAG, value: candidate}
            - {name: GATE_THRESHOLDS_PATH, value: /config/gate_thresholds_03.yaml}
            - {name: GATE_ONLY, value: "0"}     # "1" = re-gate the stored experiment only
          resources:                     # initial, not measured; revised in F-T06
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: ragops-data, mountPath: /data}
            - {name: gate, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ragops-data
          persistentVolumeClaim:
            claimName: rahbar-ragops-pvc-03
        - name: gate
          configMap:
            name: rahbar-gate-03
        - {name: tmp, emptyDir: {}}
