apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rahbar-ragops-pvc-03
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
    ragops: "03"
spec:
  # minikube is single-node: several pods on that node may mount an RWO volume.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName omitted -> minikube's default "standard"
