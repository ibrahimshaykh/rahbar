# The RAHBAR corpus. Re-fetch with:  python corpus/fetch.py
# Verify with:                        python corpus/fetch.py --verify
#
# Every entry needs a name and a url. doc_version and superseded become chunk
# metadata (section 3.1): they are how the retriever tells the current rule
# from the repealed one.
#
# Fetched and verified 2026-11-04 (9 of 9 match corpus/MANIFEST.md). See
# docs/CORPUS.md for the seven-property mapping and the real evidence behind
# each one (clause text, table content, scan confirmation).

documents:

  # Property 2: two versions of one policy. ALSO property 3: confirmed a scan -
  # 24 of its 26 pages have no text layer (see docs/evidence/pdffonts_scan_proof.txt).
  - name: Undergraduate Academic Rules (Aug 2023)
    url: http://nu.edu.pk/public/downloads/Academic-Rules-Undergrad-Aug-2023.pdf
    doc_version: "2023-08"
    superseded: true
    notes: >
      Downloaded and verified 2026-11-04. Pages 2-25 of 26 are a scanned
      image with no text layer (confirmed by pypdf font/text introspection);
      only the title page and the contact footer have real text. Needs OCR
      (tesseract-ocr + poppler-utils, in the indexer image) to be fully
      indexed - this host has neither, so this is a documented, not-yet-
      recovered loss until the real indexer Job runs.

