<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAHBAR</title>
<style>
  :root {
    --bg: #f4f5f2; --panel: #ffffff; --ink: #171a1e; --muted: #5b6168; --line: #dde0dc;
    --accent: #28497a; --accent-ink: #ffffff; --accent-soft: #e8edf4; --accent-2: #4a6f9e;
    --grounded: #3c6e4f; --grounded-bg: #eaf2ec;
    --uncovered: #8c6a28; --uncovered-bg: #fbf1de;
    --err: #9b3a2e; --err-bg: #fcebe7;
    --radius: 12px; --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(23,26,30,.04), 0 8px 24px -12px rgba(23,26,30,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --panel: #1b1e22; --ink: #e9e8e3; --muted: #9ba0a6; --line: #2a2e33;
      --accent: #8fb0d9; --accent-ink: #0f1823; --accent-soft: #202a37; --accent-2: #6f93c0;
      --grounded: #7fc79a; --grounded-bg: #19261e;
      --uncovered: #d9b467; --uncovered-bg: #2c2210;
      --err: #e58a7a; --err-bg: #301a16;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417; --panel: #1b1e22; --ink: #e9e8e3; --muted: #9ba0a6; --line: #2a2e33;
    --accent: #8fb0d9; --accent-ink: #0f1823; --accent-soft: #202a37; --accent-2: #6f93c0;
    --grounded: #7fc79a; --grounded-bg: #19261e;
    --uncovered: #d9b467; --uncovered-bg: #2c2210;
    --err: #e58a7a; --err-bg: #301a16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

  .glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(640px 360px at 14% -6%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      radial-gradient(520px 320px at 100% 4%, color-mix(in srgb, var(--grounded) 7%, transparent), transparent 72%);
  }

  main { position: relative; z-index: 1; max-width: 740px; margin: 0 auto; padding: 56px 20px 190px; }

  header { margin-bottom: 40px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .mark { display: flex; align-items: center; gap: 12px; }
  .mark svg { flex: none; color: var(--accent); }
  .mark h1 { margin: 0; font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
             font-size: clamp(32px, 5.5vw, 44px); font-weight: 500; letter-spacing: 0.005em; line-height: 1; }
  .mark .ur { font-size: 19px; color: var(--muted); font-family: Georgia, serif; margin-left: 2px; }
  header p { margin: 14px 0 0; max-width: 48ch; color: var(--muted); font-size: 16px; line-height: 1.6; }

  .theme-btn { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
               flex: none; padding: 0; border-radius: 10px; border: 1px solid var(--line);
               background: var(--panel); color: var(--muted); cursor: pointer;
               transition: color 160ms ease, border-color 160ms ease; }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .index-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .stat { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
          border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--muted); }
  .stat svg { flex: none; }
  .stat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.live b { color: var(--grounded); }
  .stat.down b { color: var(--uncovered); }

  .examples { margin-top: 26px; }
  .examples .label { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .example { display: flex; align-items: flex-start; gap: 10px; text-align: left; font-size: 14px;
             padding: 13px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line);
             background: var(--panel); color: var(--ink); cursor: pointer; line-height: 1.4;
             transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease; }
  .example svg { flex: none; color: var(--accent); margin-top: 1px; }
  .example:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .example:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #thread { display: flex; flex-direction: column; gap: 24px; margin-top: 30px; }

  .rise { opacity: 0; transform: translateY(10px); transition: opacity 420ms ease, transform 420ms ease; }
  .rise.in { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; transition: none; }
  }

  .q { align-self: flex-end; max-width: 82%; background: var(--accent); color: var(--accent-ink);
       padding: 12px 16px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; font-size: 15.5px;
       box-shadow: var(--shadow); }

  .a { position: relative; background: var(--panel); border-radius: var(--radius);
       padding: 18px 20px 16px; border: 1px solid var(--line); box-shadow: var(--shadow);
       border-left: 3px solid var(--line); }
  .a.grounded { border-left-color: var(--grounded); }
  .a.uncovered { border-left-color: var(--uncovered); }

  .status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600;
            margin-bottom: 12px; }
  .status svg { flex: none; }
  .status.grounded { color: var(--grounded); }
  .status.uncovered { color: var(--uncovered); }

  .a .text { white-space: pre-wrap; margin: 0; font-size: 16px; line-height: 1.65; max-width: 62ch; }

  .sources { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sources h3 { margin: 0 0 10px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .src-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .src-card { display: flex; gap: 9px; align-items: flex-start; padding: 10px 11px; border-radius: var(--radius-sm);
              background: var(--accent-soft); font-size: 13px; line-height: 1.45; }
  .src-card svg { flex: none; color: var(--accent); margin-top: 2px; }
  .src-card .doc { color: var(--ink); font-weight: 600; display: block; }
  .src-card .loc { color: var(--muted); }

  details.passages { margin-top: 14px; }
  details.passages summary { cursor: pointer; color: var(--muted); font-size: 13.5px; list-style: none;
                              display: inline-flex; align-items: center; gap: 5px; }
  details.passages summary::-webkit-details-marker { display: none; }
  details.passages summary .tri { display: inline-block; transition: transform 180ms ease; }
  details.passages[open] summary .tri { transform: rotate(90deg); }
  .p-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .p-row:last-child { border-bottom: none; }
  .p-row .src { color: var(--ink); font-weight: 600; }
  .p-row .sec { color: var(--muted); grid-column: 1 / 2; }
  .p-row .score-wrap { grid-column: 2 / 3; grid-row: 1 / 3; display: flex; align-items: center; gap: 8px; min-width: 110px; }
  .p-row .score-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .p-row .score-bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .p-row .score-num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 34px; text-align: right; }

  .meta { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
          font-size: 12px; color: var(--muted); }
  .meta span { white-space: nowrap; }
  .copy { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; padding: 5px 10px;
          font: inherit; font-size: 12px; color: var(--muted); background: transparent;
          border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
          transition: color 160ms ease, border-color 160ms ease; }
  .copy:hover { color: var(--accent); border-color: var(--accent); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy.done { color: var(--grounded); border-color: var(--grounded); }

  .err { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--err-bg);
         color: var(--err); border-radius: var(--radius); padding: 14px 18px; font-size: 14.5px;
         box-shadow: var(--shadow); }
  .err .retry { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding: 6px 12px;
                font: inherit; font-size: 13px; font-weight: 600; color: var(--err); background: transparent;
                border: 1px solid currentColor; border-radius: 8px; cursor: pointer; opacity: 0.85;
                transition: opacity 160ms ease; }
  .err .retry:hover { opacity: 1; }
  .err .retry:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  .pending { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
             padding: 17px 20px; box-shadow: var(--shadow); }
  .pending .label { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--muted); margin-bottom: 12px; }
  .pending .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none;
                  animation: pulse 1.4s ease-in-out infinite; }
  .pending .bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .pending .bar span { display: block; height: 100%; width: 40%; background: var(--accent);
                        animation: compose 1.3s ease-in-out infinite; }
  @keyframes compose { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }
  @media (prefers-reduced-motion: reduce) {
    .pending .bar span { animation: none; width: 100%; opacity: 0.5; }
    .pending .dot { animation: none; }
  }

  form { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 18px 20px 22px;
         background: linear-gradient(to top, var(--bg) 60%, transparent); }
  .bar { max-width: 740px; margin: 0 auto; display: flex; gap: 10px; align-items: center;
         background: color-mix(in srgb, var(--panel) 86%, transparent);
         backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
         border: 1px solid var(--line); border-radius: 16px; padding: 7px 7px 7px 16px;
         box-shadow: var(--shadow); }
  textarea { flex: 1; resize: none; height: 46px; max-height: 150px; padding: 12px 0; font: inherit;
             font-size: 15.5px; line-height: 22px; color: var(--ink); background: transparent; border: 0;
             overflow-y: auto; }
  textarea:focus { outline: none; }
  button { display: flex; align-items: center; gap: 7px; min-height: 42px; padding: 0 20px; font: inherit;
           font-size: 15px; font-weight: 600; color: var(--accent-ink); background: var(--accent); border: 0;
           border-radius: 11px; cursor: pointer; transition: opacity 150ms ease, transform 100ms ease; }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hint { max-width: 740px; margin: 9px auto 0; padding: 0 16px; font-size: 12px; color: var(--muted); }
  kbd { font: inherit; font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line);
        background: var(--panel); }

  @media (max-width: 480px) {
    main { padding: 40px 16px 180px; }
    .q { max-width: 90%; }
    .src-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <header>
    <div class="top">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 2.75V5M12 19V21.25M21.25 12H19M5 12H2.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <h1>RAHBAR</h1>
        <span class="ur">رہبر</span>
      </div>
      <button type="button" class="theme-btn" id="theme" aria-label="Switch colour theme" title="Switch colour theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 13.2A8.2 8.2 0 0 1 10.8 4a8.25 8.25 0 1 0 9.2 9.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p>Ask about university policy, fees, or academic rules. Answers come only from the
       indexed documents, with the exact source cited. If the documents don't cover it,
       it says so.</p>
    <div class="index-stats" id="stats" aria-live="polite"></div>
    <div class="examples">
      <div class="label">Try asking</div>
      <div class="ex-grid" id="examples">
        <button type="button" class="example">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 3v5h5M9 13h6M9 17h6M9 9h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>What CGPA puts a student on academic warning?</span>
        </button>
        <button type="button" class="example">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 3v5h5M9 13h6M9 17h6M9 9h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>What is the current minimum attendance requirement?</span>
        </button>
        <button type="button" class="example">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 3v5h5M9 13h6M9 17h6M9 9h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>How much is the BS fee per credit hour?</span>
        </button>
      </div>
    </div>
  </header>
  <section id="thread" aria-live="polite"></section>
</main>

<form id="ask">
  <div class="bar">
    <textarea id="question" aria-label="Your question" placeholder="Ask about the documents…" maxlength="500" rows="1" required></textarea>
    <button id="send" type="submit">
      <span>Ask</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="hint"><kbd>Enter</kbd> to send, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line, <kbd>/</kbd> to focus · 3 to 500 characters</div>
</form>

<script>
// The API sits behind the same Ingress host at /api. For local development you can
// point elsewhere with ?api=http://localhost:8000 (that server must allow CORS).
const API_BASE = new URLSearchParams(location.search).get("api") || window.RAHBAR_API || "";

const thread = document.getElementById("thread");
const form = document.getElementById("ask");
const input = document.getElementById("question");
const send = document.getElementById("send");
const examples = document.getElementById("examples");

// Model output and retrieved text are untrusted. Everything below is built with
// textContent and createElement, never innerHTML, so a document or an answer
// containing HTML or script is shown as text and never run.
function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgIcon(d, extra) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", "16"); svg.setAttribute("height", "16"); svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none"); svg.setAttribute("aria-hidden", "true");
  for (const dd of d) {
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", dd);
    p.setAttribute("stroke", "currentColor");
    p.setAttribute("stroke-width", "1.6");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.append(p);
  }
  if (extra) for (const [k, v] of Object.entries(extra)) svg.setAttribute(k, v);
  return svg;
}

const ICON_CHECK = ["M12 21.25a9.25 9.25 0 1 0 0-18.5 9.25 9.25 0 0 0 0 18.5Z", "M8 12.2l2.6 2.6L16.3 9"];
const ICON_INFO = ["M12 21.25a9.25 9.25 0 1 0 0-18.5 9.25 9.25 0 0 0 0 18.5Z", "M12 11v5.5M12 7.75v.01"];
const ICON_DOC = ["M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z", "M15 3v5h5"];
const ICON_COPY = ["M9 9h10v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1Z", "M16 9V5a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h2"];
const ICON_LAYERS = ["M12 3.5 3.5 8l8.5 4.5L20.5 8 12 3.5Z", "M3.5 12.5 12 17l8.5-4.5"];
const ICON_PULSE = ["M3 12h4l2.5-6 4 12L16.5 12H21"];
const ICON_RETRY = ["M20 11.5A8 8 0 1 1 17.6 6", "M20.5 3.5V9H15"];

function cite(c) {
  return c.page != null ? `${c.section}, p. ${c.page}` : c.section;
}

function riseIn(node) {
  node.classList.add("rise");
  requestAnimationFrame(() => requestAnimationFrame(() => node.classList.add("in")));
  return node;
}

function renderAnswer(data, cacheHeader) {
  const grounded = !!data.answered_from_context;
  const card = el("article", { class: `a ${grounded ? "grounded" : "uncovered"}` });

  const status = el("div", { class: `status ${grounded ? "grounded" : "uncovered"}` });
  status.append(svgIcon(grounded ? ICON_CHECK : ICON_INFO),
    document.createTextNode(grounded ? "Grounded in the documents" : "Not covered by the documents"));
  card.append(status);

  card.append(el("p", { class: "text" }, data.answer ?? ""));

  if (Array.isArray(data.citations) && data.citations.length) {
    const box = el("div", { class: "sources" });
    box.append(el("h3", {}, "Sources"));
    const grid = el("div", { class: "src-grid" });
    for (const c of data.citations) {
      const card2 = el("div", { class: "src-card" });
      card2.append(svgIcon(ICON_DOC));
      const text = el("span");
      text.append(el("span", { class: "doc" }, c.source));
      text.append(el("span", { class: "loc" }, cite(c)));
      card2.append(text);
      grid.append(card2);
    }
    box.append(grid);
    card.append(box);
  }

  if (Array.isArray(data.retrieved) && data.retrieved.length) {
    const details = el("details", { class: "passages" });
    const summary = el("summary");
    summary.append(el("span", { class: "tri" }, "▸"), document.createTextNode(` Retrieved passages (${data.retrieved.length})`));
    details.append(summary);
    for (const r of data.retrieved) {
      const row = el("div", { class: "p-row" });
      row.append(el("div", { class: "src" }, r.source));
      row.append(el("div", { class: "sec" }, r.section + (r.page != null ? `, p. ${r.page}` : "")));
      const scoreWrap = el("div", { class: "score-wrap" });
      const pct = typeof r.score === "number" ? Math.max(0, Math.min(100, r.score * 100)) : 0;
      const barOuter = el("div", { class: "score-bar" });
      barOuter.append(el("span", { style: `width:${pct}%` }));
      scoreWrap.append(barOuter, el("span", { class: "score-num" }, typeof r.score === "number" ? r.score.toFixed(3) : "–"));
      row.append(scoreWrap);
      details.append(row);
    }
    card.append(details);
  }

  const bits = [];
  if (data.confidence) bits.push(`confidence ${data.confidence}`);
  if (data.provider) bits.push(`provider ${data.provider}`);
  const cached = typeof data.cached === "boolean" ? data.cached
               : cacheHeader ? cacheHeader.toUpperCase() === "HIT" : null;
  if (cached !== null) bits.push(cached ? "cache hit" : "cache miss");
  if (data.request_id) bits.push(`request ${data.request_id}`);
  const meta = el("div", { class: "meta" });
  for (const b of bits) meta.append(el("span", {}, b));
  if (data.answer) {
    const copy = el("button", { type: "button", class: "copy" });
    copy.append(svgIcon(ICON_COPY, { width: "13", height: "13" }), el("span", {}, "Copy"));
    copy.addEventListener("click", async () => {
      const lines = [data.answer];
      if (Array.isArray(data.citations) && data.citations.length) {
        lines.push("", "Sources:");
        for (const c of data.citations) lines.push(`- ${c.source} / ${cite(c)}`);
      }
      try {
        await navigator.clipboard.writeText(lines.join("\n"));
        copy.classList.add("done");
        copy.lastElementChild.textContent = "Copied";
        setTimeout(() => { copy.classList.remove("done"); copy.lastElementChild.textContent = "Copy"; }, 1800);
      } catch {
        copy.lastElementChild.textContent = "Press Ctrl+C";
      }
    });
    meta.append(copy);
  }
  card.append(meta);

  return card;
}

function errorCard(message, question) {
  const box = el("div", { class: "err" });
  box.append(el("span", {}, message));
  const retry = el("button", { type: "button", class: "retry" });
  retry.append(svgIcon(ICON_RETRY, { width: "13", height: "13" }), el("span", {}, "Try again"));
  // Re-ask without echoing the question again: it is already above this error.
  retry.addEventListener("click", () => { box.remove(); ask(question, true); }, { once: true });
  box.append(retry);
  return box;
}

function errorMessage(status, body) {
  const detail = body && typeof body.detail === "string" ? body.detail : "";
  if (status === 422) return "Questions must be 3 to 500 characters.";
  if (status === 429) return "Too many questions in a short time. Wait a moment and try again.";
  if (status === 503) return `The service is not ready yet${detail ? `: ${detail}` : "."}`;
  if (status >= 500) return `The service failed (HTTP ${status})${detail ? `: ${detail}` : "."}`;
  return `Request failed (HTTP ${status})${detail ? `: ${detail}` : "."}`;
}

const STAGES = ["Searching the indexed documents…", "Reading the retrieved passages…", "Composing an answer…"];

function pendingCard() {
  const card = el("div", { class: "pending" });
  const label = el("div", { class: "label" });
  label.append(el("span", { class: "dot" }), el("span", {}, STAGES[0]));
  card.append(label);
  const bar = el("div", { class: "bar" });
  bar.append(el("span"));
  card.append(bar);
  let i = 0;
  const timer = setInterval(() => {
    i = (i + 1) % STAGES.length;
    label.lastElementChild.textContent = STAGES[i];
  }, 1400);
  card._stopStages = () => clearInterval(timer);
  return card;
}

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.max(46, Math.min(input.scrollHeight, 150)) + "px";
}

async function ask(question, isRetry = false) {
  examples.closest(".examples")?.remove();
  if (!isRetry) thread.append(riseIn(el("div", { class: "q" }, question)));
  const pending = pendingCard();
  thread.append(pending);
  pending.scrollIntoView({ behavior: "smooth", block: "end" });
  send.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    let body = null;
    try { body = await res.json(); } catch { /* non-JSON error page */ }
    pending._stopStages();
    pending.remove();
    if (!res.ok) {
      thread.append(riseIn(errorCard(errorMessage(res.status, body), question)));
    } else {
      thread.append(riseIn(renderAnswer(body, res.headers.get("X-Cache"))));
    }
  } catch (err) {
    pending._stopStages();
    pending.remove();
    thread.append(riseIn(errorCard(
      `Could not reach the API at ${API_BASE || location.origin}/api/ask.`, question)));
  } finally {
    send.disabled = false;
    input.focus();
    thread.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "end" });
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q.length < 3) return;
  input.value = "";
  autosize();
  ask(q);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", autosize);

// "/" focuses the question box from anywhere on the page.
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== input && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    input.focus();
  }
});

examples.addEventListener("click", (e) => {
  const btn = e.target.closest(".example");
  if (!btn) return;
  input.value = btn.querySelector("span:last-child").textContent;
  autosize();
  input.focus();
});

// --- colour theme: system by default, overridable, remembered per browser ---
const themeBtn = document.getElementById("theme");
try {
  const saved = localStorage.getItem("rahbar-theme");
  if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
} catch { /* storage blocked: stay on the system theme */ }

themeBtn.addEventListener("click", () => {
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const current = document.documentElement.dataset.theme || (systemDark ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("rahbar-theme", next); } catch { /* ignore */ }
});

// --- live index status, read from the API's own /readyz (never hard-coded) ---
const statsBox = document.getElementById("stats");

function stat(icon, label, value, kind) {
  const node = el("span", { class: kind ? `stat ${kind}` : "stat" });
  node.append(svgIcon(icon, { width: "14", height: "14" }));
  const text = el("span");
  text.append(document.createTextNode(`${label} `), el("b", {}, value));
  node.append(text);
  return node;
}

async function loadStats() {
  try {
    // Live state: never answer this from the browser cache.
    const res = await fetch(`${API_BASE}/readyz`, { cache: "no-store" });
    const body = await res.json();
    statsBox.replaceChildren();
    if (res.ok && body.status === "ready") {
      statsBox.append(stat(ICON_PULSE, "service", "ready", "live"));
      const count = body.checks && body.checks.count;
      if (typeof count === "number") statsBox.append(stat(ICON_LAYERS, "passages indexed", count.toLocaleString()));
    } else {
      statsBox.append(stat(ICON_PULSE, "service", "not ready", "down"));
      if (body.detail) statsBox.append(stat(ICON_INFO, "", String(body.detail)));
    }
  } catch {
    statsBox.replaceChildren(stat(ICON_PULSE, "service", "unreachable", "down"));
  }
}
loadStats();
</script>
